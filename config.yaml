# voice_tap 配置文件
#
# 这个文件同时被探测脚本和主程序读取。
# 需要改参数时改这里就行，不用改代码。

# ---------------------------------------------------------------- 音频
audio:

  # 用哪个麦克风。
  #
  # 2026-09-26 实测确认：设备 1（麦克风 USB2.0 Device，MME 接口）能正常录到声音。
  # 设备 10 / 11 / 27 是同一个物理麦克风通过 DirectSound / WASAPI / WDM-KS
  # 等其他接口暴露出来的副本，也能用，但序号可能随系统状态变化。
  #
  # 如果想换设备：先跑 mic_level.bat，对着麦克风说话，看哪一行的柱子动，
  # 然后把那个序号填到这里。
  input_device: 1

  # 音频采集采样率。填 null 表示自动（先试 16000，不支持就用设备默认值）。
  samplerate: null

  # 静音检测阈值（RMS）。超过这个值就认为你在说话。
  #
  # 2026-09-26 实测标定（设备 1，USB2.0 Device）：
  #     环境底噪   0.00181
  #     语音 90分位 0.06691
  #     语音峰值   0.11294
  #     建议阈值   0.0246  —— 语音峰值是阈值的 4.6 倍，余量充足
  #
  # 如果换了麦克风或者环境噪声变化大，重新跑 probe.bat 的麦克风标定阶段即可。
  vad_threshold: 0.0246

  # 尾部静音多久算一句话说完了（秒）
  silence_duration: 0.4

  # 单句话最长多少秒，超过就强制掐断送去识别
  max_utterance: 6.0

# ---------------------------------------------------------------- 语音识别
asr:

  # Whisper 模型大小：tiny / base / small / medium
  # small 约 480MB，中英文都能用，是准确率和速度的平衡点。
  # 觉得识别不准就换 medium（更大更慢），嫌慢就换 base。
  model: small

  # 强制识别语言。填 null 让模型自己判断；填 zh 强制中文。
  language: null

  # 送进模型前要不要裁掉首尾静音。
  #
  # 实测后改成 false：识别耗时是**固定的**（约 3.2 秒，和音频长短几乎无关），
  # 裁掉静音并不能省时间，却减少了模型能参考的上下文，反而更容易听错。
  trim_silence: false

  # 让模型再自己做一次静音过滤。我们已经做过一遍了，这层可能是重复劳动 ——
  # 留成开关方便对比。
  vad_filter: true

  # 用屏幕上的选项来辅助识别（强烈建议开着）：
  #   1. 看一眼选项是中文还是英文，直接告诉模型，不让它自己猜
  #   2. 把 5 个选项当提示词喂给模型
  # 实测：模型在半秒的短音频上会把英文判成法语/意大利语，一判错整句全错；
  # 而"屏幕上有哪几个候选词"是我们手里现成的、确定的信息。
  use_screen_hint: true

  # 平均对数概率低于这个值就当作低置信度，只打印告警不影响点击。
  # 想让低置信度时不点击，把这个值调高即可（例如 -0.6）。
  min_confidence: -1.0

# ---------------------------------------------------------------- 匹配
match:

  # 是否启用「编辑距离」模糊匹配（容忍听错一两个字母）
  fuzzy_enabled: true

  # 允许的最大编辑距离
  max_distance: 1

  # 是否启用拼音匹配（中文同音字容错，例如「骄奢淫逸」听成「骄奢淫意」）
  pinyin_enabled: true

  # 子串匹配时，短词至少要多长才允许匹配
  # 设成 2 是为了让「简单」能命中「简单、朴素」，同时避免单个字乱匹配
  min_substring_length: 2

# ---------------------------------------------------------------- 语音开关
voice:

  # 点击之后多长时间内**不监听语音**（毫秒）。
  #
  # 为什么要它：点完一个选项之后，**手机会把那个单词的读音播出来**，
  # 麦克风会把它收进去。程序会误以为你在说话，送去识别，
  # 得到的就是刚答过那个词 —— 实测日志里那些 'Brooke.' 'Benevolent' 'Convey'
  # 全是手机念的，不是你说的。等你真正开口时，界面早翻过去了。
  #
  # 一个单词的读音约 1～1.2 秒，加上点击到开始播放的延迟，2.5 秒比较稳。
  # 调小 = 你能更快说下一句；调大 = 更不容易被手机的声音带偏。
  mute_after_click_ms: 2000

  # 启动时语音是否开启。运行中按 F7 随时开关。
  enabled: true

  # 允许说「下一题」来翻页（答错进详情页后用它继续）。
  #
  # 注意：这是「直给」——说了就点固定坐标，不读屏校验。
  # 所以在答题页上误说「下一题」也会点下去。这是有意选的取舍。
  next_command: true

# ---------------------------------------------------------------- 点击
click:

  # 语音路径的防连点（毫秒）。
  #
  # 实测几乎不会触发：语音整条流水线（静音判尾 + 识别）本身就要 2 秒以上，
  # 两次点击天然相隔很远。留着纯粹是保险。
  #
  # 注意：**按键动作不受这一项限制**。按住小键盘不放造成的重复，
  # 是在 hotkey 那一层用「按下/抬起」状态挡的 —— 不靠计时猜。
  debounce_ms: 400

  # 点击之后等多久才接受下一条指令（毫秒）
  settle_ms: 300

# ---------------------------------------------------------------- 热键
hotkey:

  # 按住说话、松开触发识别
  push_to_talk: f8

  # 在「常驻监听」和「按住说话」两种模式间切换
  toggle_mode: f9

  # 开关「小键盘快捷点击」
  toggle_numpad: f10

  # 开关语音（F7）
  toggle_voice: f7

  # 小键盘模式是否默认开启。
  #
  # 开着的时候：按小键盘 1~9 就直接点第 1~9 个选项，不用说话；
  #   按小键盘 0 点「下一题」（答错或点「不记得了」之后用它继续）。
  #   —— 只认小键盘，主键盘上的数字键完全不受影响，不会干扰你打字。
  #   —— 需要 NumLock 是开的，否则小键盘会被系统识别成方向键。
  #   —— 选项超过 9 个时，第 10 个以后没法用小键盘点。
  numpad_enabled: false

  # 小键盘数字对应到第几个选项。上面的数字键 = 下面的选项序号，
  # 一般不用改；如果哪天想反过来（1 对应最后一个），改这里即可。
  numpad_reverse: false

  # 「下一题」按钮的固定坐标。
  #
  # 2026-09-26 实测：按钮文字就是「下一题」，坐标 (909, 2476)。
  # 它在页面底部，属于固定位置的控件 —— 不像选项会随题干长短漂移，
  # 所以这里可以放心用固定坐标。
  #
  # 如果发现按 0 点不到（比如详情页上和这里位置不同），
  # 把它改回 null，程序会改成每次读屏去找按钮：
  #     python -m voice_tap.main --calibrate
  fixed_next_position: [909, 2476]

  # 注意：选项本身**不走固定坐标**，每次都读屏取实时位置。
  #
  # 原因：选项位置会随题干长短整体偏移。实测同一个选项见过 1375 和 1418
  # 两个位置（差 43 像素），而行高只有 150 —— 复用旧坐标会静默点错，
  # 点了、不报错、但不是你要的那个。而读屏一次就同时拿到文字和当前坐标，
  # 省掉它等于把「精确」换成「猜」。

run:

  # 启动时的默认模式：listen（常驻监听）或 hotkey（按住说话）
  default_mode: listen

  # 只画圈不真点（调试用）
  preview: false

  # 是否播放提示音
  sound: false

# ---------------------------------------------------------------- 预读界面
#
# 「预读」= 在后台提前把界面读好，等你需要时立刻就能用，省掉等待。
# 读屏是整条链路上最慢的一环，所以能提前做就提前做。

prefetch:

  # 点击之后预读（开着）。
  #
  # 这是整个提速方案的核心，工作方式是：
  #     按数字键 → 用上一次预读好的坐标点 → 点完立刻读下一屏 → 下次直接可用
  #
  # **按数字键时不会重新读屏**（除非预读没做成）。你通过 scrcpy 看着屏幕操作，
  # 界面状态你自己清楚，不需要程序每次再确认一遍。
  #
  # 如果你自己用鼠标动了界面，按小键盘的「.」强制重新读一次。
  after_click: true

  # 点击后先等多久再读（毫秒）。太早读到的还是翻页前的界面。
  # 这个值需要按你的机器实测调 —— 日志里会打印「读到新界面、距点击多少毫秒」。
  click_delay_ms: 300

  # 第一次读到新界面就收工；还是旧界面就隔多久再读一次**确认**（毫秒）。
  #
  # 注意预读**总共最多读两次**：确认那一次无论读到什么都收下 —— 连续两次一样，
  # 就说明这就是当前屏幕，继续读只是白耗时间（每次读屏约 2.4 秒），
  # 而这段时间你的按键全被挡住。所以不再有第 3、4 次。
  click_retry_ms: 250

  # 检测到你开口时也预读一次。
  # 现在默认关着 —— 先看看「点击后预读」单独能带来多少收益，再决定要不要叠加。
  on_speech: false

  # 预读结果最多能用多久（秒）。
  #
  # 这是安全阀：预读之后如果你用鼠标自己翻了页，缓存里就是过期界面，
  # 拿它去匹配可能点错。超过这个时间就作废，退回当场读屏（慢一点，但一定是当前的）。
  #
  # 实测：读屏一次要 2.3 秒，而 Gre 一道题要思考好几秒 —— 8 秒太短，
  # 预读几乎全部过期作废，一次都没用上。所以放宽到 60 秒。
  # 用鼠标手动翻页的情况下才有过期风险；只用语音/小键盘的话不存在。
  cache_max_age: 60.0

# ---------------------------------------------------------------- 置顶浮窗
#
# 浮在 scrcpy 上面的一个小窗口，显示三块内容：
#   ①各项开关（能点它开/关）②程序手里那一屏的选项（核对读屏对不对）
#   ③识别到的语音与按下的小键盘键
#
# **界面里的每个开关走的都是和热键完全相同的那几个函数** ——
# 点界面上的「语音」和按 F7 是同一条代码，所以不会出现
# 「界面显示开着、实际没开」这种分裂。

gui:

  # 启动时是否自动开界面。
  # 默认关着；想临时开一下，命令行加 --gui 即可（run_gui.bat 就是这么干的）。
  enabled: false

  # 窗口位置与大小 [x, y, 宽, 高]。
  #
  # 这只是**首次的**位置 —— 你拖动窗口后，当前位置会记在 debug/gui_window.txt，
  # 下次开窗接着用那个位置。
  #
  # 为什么不写回这里：这个文件是逐行手写注释的，pyyaml 回写会把注释全抹掉。
  window: [40, 120, 360, 520]

  # 是否始终浮在最上层（scrcpy 就在它下面）
  topmost: true

  # 界面刷新间隔（毫秒）。界面只是照着状态画一遍，150 毫秒已经够跟手了。
  # 填得比 30 还小会按 30 算 —— 再小就等于让界面把主线程占死（忙循环）。
  refresh_ms: 150
